[package]
name = "go-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"

[features]
# Opt-in inclusive CPU stage timers for local experiments; absent in production.
search-profiling = []
search-hotspots = ["search-profiling"]
# Candidate: omit only redundant catch-up refresh on a proven single-parent path.
catchup-path-refresh = []
ancestor-single-set = []
# Compatibility flag: connected-edge iteration is now always maintained/used
# by root collection and statistics, preserving the original legal-edge order.
sparse-child-iteration = []

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
sha2 = "0.10"

[dev-dependencies]
serde_json = "1"
