[workspace]
members = ["crates/go-core", "crates/go-protocol", "crates/go-server"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Unlicense"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tonic = "0.14"
prost = "0.14"
tracing = "0.1"
